{% extends "base.html" %}
{% block content %}
<h1>{% if race %}Edit race{% else %}New race{% endif %}</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ form_action }}" class="stack-form">
  <label>
    Name
    <input type="text" name="name" required maxlength="200"
           value="{{ race.name if race else '' }}" />
  </label>
  <label>
    Race date
    <input type="date" name="race_date" required
           value="{{ race.race_date if race else '' }}" />
  </label>
  <label>
    Discipline
    <select name="discipline" required>
      {% for d in disciplines %}
      <option value="{{ d }}" {% if race and race.discipline == d %}selected{% endif %}>{{ d }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Goal type
    <select name="goal_type" required>
      {% for g in goal_types %}
      <option value="{{ g }}" {% if race and race.goal_type == g %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Goal value <span class="muted small">(e.g. target time, watts, or HR — optional)</span>
    <input type="text" name="goal_value" maxlength="100"
           value="{{ race.goal_value or '' }}" />
  </label>
  <label>
    Notes
    <textarea name="notes" rows="3" maxlength="2000">{{ race.notes or '' }}</textarea>
  </label>
  <label>
    Status
    <select name="status">
      {% for s in statuses %}
      <option value="{{ s }}" {% if race and race.status == s %}selected{% elif not race and s == 'planned' %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">{% if race %}Update{% else %}Create{% endif %}</button>
  <a href="/races">Cancel</a>
</form>
{% endblock %}
